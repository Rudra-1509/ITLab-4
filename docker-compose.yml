services:
  postgres:
    image: postgres:15-alpine
    container_name: ticketing_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ticketing_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: ticketing_gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      EVENT_SERVICE_URL: "http://event-service:8002"
      BOOKING_SERVICE_URL: "http://booking-service:8003"
      PRICING_SERVICE_URL: "http://pricing-service:8004"
      ANALYTICS_SERVICE_URL: "http://analytics-service:8005"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth/Dockerfile
    container_name: ticketing_auth_service
    ports:
      - "8001:8001"
    environment:
      AUTH_SERVICE_PORT: 8001
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  event-service:
    build:
      context: .
      dockerfile: backend/services/events/Dockerfile
    container_name: ticketing_event_service
    ports:
      - "8002:8002"
    environment:
      EVENT_SERVICE_PORT: 8002
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: backend/services/bookings/Dockerfile
    container_name: ticketing_booking_service
    ports:
      - "8003:8003"
    environment:
      BOOKING_SERVICE_PORT: 8003
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
      PRICING_SERVICE_URL: "http://pricing-service:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pricing-service:
    build:
      context: .
      dockerfile: backend/services/pricing/Dockerfile
    container_name: ticketing_pricing_service
    ports:
      - "8004:8004"
    environment:
      PRICING_SERVICE_PORT: 8004
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: backend/services/analytics/Dockerfile
    container_name: ticketing_analytics_service
    ports:
      - "8005:8005"
    environment:
      ANALYTICS_SERVICE_PORT: 8005
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notifications/Dockerfile
    container_name: ticketing_notification_service
    ports:
      - "8006:8006"
    environment:
      NOTIFICATION_SERVICE_PORT: 8006
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ticketing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketing_frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
